name: Desktop Builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - macos
          - all
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(
        github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'windows' &&
        '{"include":[{"label":"windows","os":"windows-2022"}]}' ||
        github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'linux' &&
        '{"include":[{"label":"linux","os":"ubuntu-22.04"}]}' ||
        github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'macos' &&
        '{"include":[{"label":"macos","os":"macos-14"}]}' ||
        '{"include":[{"label":"linux","os":"ubuntu-22.04"},{"label":"windows","os":"windows-2022"},{"label":"macos","os":"macos-14"}]}'
      ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Upload Linux artifacts
        if: matrix.label == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: tgcampaigner-linux
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 3

      - name: Upload Windows artifacts
        if: matrix.label == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: tgcampaigner-windows
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 3

      - name: Upload macOS artifacts
        if: matrix.label == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: tgcampaigner-macos
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
          if-no-files-found: error
          retention-days: 3
