name: Desktop Builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - macos
          - all
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all' }}
    name: Build (linux)
    runs-on: ubuntu-22.04
    env:
      VITE_LICENSE_API_BASE: https://license.tgcampaigner.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: 0xphantomotr/telepromo
          ref: main
          path: telepromo
          token: ${{ secrets.TELEPROMO_REPO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build Linux backend sidecar
        shell: bash
        run: |
          set -euo pipefail
          backend_candidate_a="${GITHUB_WORKSPACE}/telepromo/telegramGatherTool"
          backend_candidate_b="${GITHUB_WORKSPACE}/telepromo"
          if [ -x "${backend_candidate_a}/scripts/build_linux_sidecar.sh" ]; then
            backend_root="${backend_candidate_a}"
          elif [ -x "${backend_candidate_b}/scripts/build_linux_sidecar.sh" ]; then
            backend_root="${backend_candidate_b}"
          else
            echo "Backend root not found under ${backend_candidate_a} or ${backend_candidate_b}. If backend repo is private, add TELEPROMO_REPO_TOKEN secret."
            exit 1
          fi
          TGC_SKIP_LINUX_SIDECAR_PREPARE=1 ./scripts/prepare_linux_backend_sidecar.sh "${backend_root}"

      - name: Verify Linux backend sidecar output
        run: |
          test -f src-tauri/resources/backend/tgcampaigner-backend-linux-x64
          test -f src-tauri/resources/backend/tgcampaigner-backend-linux-x64.sha256

      - name: Build Tauri bundles
        run: TGC_SKIP_LINUX_SIDECAR_PREPARE=1 npm run tauri build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgcampaigner-linux
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 3

  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all' }}
    name: Build (windows)
    runs-on: windows-2022
    env:
      VITE_LICENSE_API_BASE: https://license.tgcampaigner.com
    steps:
      - name: Checkout UI repo
        uses: actions/checkout@v4

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: 0xphantomotr/telepromo
          ref: main
          path: telepromo
          token: ${{ secrets.TELEPROMO_REPO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend deps
        run: npm ci

      - name: Build Windows backend sidecar
        shell: pwsh
        run: |
          $backendCandidateA = Join-Path $env:GITHUB_WORKSPACE "telepromo\telegramGatherTool"
          $backendCandidateB = Join-Path $env:GITHUB_WORKSPACE "telepromo"
          if (Test-Path (Join-Path $backendCandidateA "scripts\build_windows_sidecar.ps1")) {
            $backendRoot = $backendCandidateA
          } elseif (Test-Path (Join-Path $backendCandidateB "scripts\build_windows_sidecar.ps1")) {
            $backendRoot = $backendCandidateB
          } else {
            throw "Backend root not found under $backendCandidateA or $backendCandidateB. If backend repo is private, add TELEPROMO_REPO_TOKEN secret."
          }
          $venvDir = Join-Path $backendRoot "venv"
          $venvPy = Join-Path $venvDir "Scripts\python.exe"
          if ((Test-Path $venvDir) -and !(Test-Path $venvPy)) {
            Write-Host "Removing non-Windows backend venv at $venvDir so sidecar build can recreate it."
            Remove-Item -Recurse -Force $venvDir
          }
          powershell -ExecutionPolicy Bypass -File .\scripts\prepare_windows_backend_sidecar.ps1 -BackendRoot $backendRoot

      - name: Verify Windows backend sidecar output
        shell: pwsh
        run: |
          if (!(Test-Path "src-tauri/resources/backend/tgcampaigner-backend-windows-x64.exe")) {
            throw "Missing src-tauri/resources/backend/tgcampaigner-backend-windows-x64.exe"
          }
          if (!(Test-Path "src-tauri/resources/backend/tgcampaigner-backend-windows-x64.exe.sha256")) {
            throw "Missing src-tauri/resources/backend/tgcampaigner-backend-windows-x64.exe.sha256"
          }

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgcampaigner-windows
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 3

  build-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all' }}
    name: Build (macos)
    runs-on: macos-14
    env:
      VITE_LICENSE_API_BASE: https://license.tgcampaigner.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgcampaigner-macos
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
          if-no-files-found: error
          retention-days: 3
